<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The page title and description belong to the route, via
         $lib/PageHead.svelte — deliberately not hardcoded here. A hardcoded
         description was the only text this site served for months: every route
         returned a 1,667-byte shell, and grepping for that stale string once
         produced a false "the build is broken" diagnosis. See docs/ROADMAP.md
         section 2. Avoid writing literal tag names in this comment; they end up
         in the extracted-text measurement the prerender gate uses. -->
    <!--
      CSP per spec 7.5: no inline scripts, no eval, no service workers (v0.1).
      adapter-static doesn't set headers; configure these at the Cloudflare Pages level via _headers.
    -->
    %sveltekit.head%
    <script type="module" src="/amp-nav.js"></script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
